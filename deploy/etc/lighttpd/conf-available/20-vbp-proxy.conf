# Reverse proxy for the Virtual Bavaria Panel gateway (gateway/web.py via
# uvicorn on 127.0.0.1:8000, unprivileged). uvicorn already serves the
# webapp itself (StaticFiles mount) as well as the REST/WebSocket API, so
# lighttpd's only job for VBP is holding privileged port 80 -- proxy
# everything, unconditionally, rather than hand-copying webapp/ into a
# separate docroot (that duplication caused repo/deployment drift before).
#
# Exception: /app is NOT part of virtualBavariaPanel -- it's a separately
# deployed build of ~/venus-html5-app (Victron's Venus OS HTML5 app),
# served from this same lighttpd instance because it was already here and
# advertised over avahi (/etc/avahi/services/victron.service, path=/app).
# uvicorn has no route for it, so it must stay on lighttpd's own static
# file serving (document-root /var/www/html) rather than being proxied.
server.modules += ("mod_proxy")

# (/|$): a bare "^/app" also caught /apple-touch-icon.png.
$HTTP["url"] !~ "^/app(/|$)" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8000 )) )
    # Without this, mod_proxy strips Connection/Upgrade before forwarding,
    # so uvicorn sees a plain GET and 404s instead of upgrading -- broke
    # /subscribe for any client going through this proxy (port 80).
    proxy.header = ( "upgrade" => "enable" )
}
