# Reverse proxy for the Virtual Bavaria Panel REST/WebSocket backend
# (gateway/web.py via uvicorn on 127.0.0.1:8000, unprivileged). Keeps the
# MFD-facing origin as port 80 (lighttpd) so the browser never sees a
# cross-origin request for the API calls or the WebSocket.
server.modules += ("mod_proxy")

$HTTP["url"] =~ "^/(status|circuits|ws)" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8000 )) )
}
